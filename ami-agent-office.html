<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AMI Agent Office: สำนักงาน AI เอเจนต์แบบเดินได้ของกลุ่ม AMI ตามแผน Shopee Mall และแผนสู่ IPO">
<title>AMI Agent Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: a full-bleed walkable 3D office; the HUD floats at the safe-area edges; an agent sheet docks right on desktop and rises from the bottom on phones. Single dark look by choice (Brady navy + ACS red). */
:root {
  --ink: #08122b;
  --panel: #0f1c40;
  --panel-2: #15275a;
  --line: #263c78;
  --text: #eaf0ff;
  --muted: #a3b7e2;
  --red: #e2283b;
  --red-hover: #f03b4e;
  --me: #1d3c8f;
  --ok: #3ccf91;
  --warn: #f2b33d;
  --crit: #ff5d6c;
  --display: "Prompt", "Noto Sans Thai", "Loma", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Noto Sans Thai", "Loma", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "IBM Plex Sans Thai", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ink); color: var(--text); font: 400 14px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #9fc0ff; outline-offset: 2px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

#hud {
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glass { background: rgba(8, 18, 43, .78); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.brand { pointer-events: auto; display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 10px 14px; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; border-radius: 8px; background: #0a1a46; position: relative; overflow: hidden; border: 1px solid #2c4590; }
.mark::before { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; height: 3px; background: var(--red); border-radius: 2px; }
.mark::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: 6px; height: 5px; background: var(--red); transform: rotate(-9deg); }
.brand h1 { margin: 0; font: 600 18px/1.2 var(--display); letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.status { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 12px; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.chip strong { font: 600 13px var(--mono); color: #fff; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: none; }
.chip.ai .dot { background: var(--warn); }
.chip.ai.live .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(60, 207, 145, .22); }
.chip.ai.denied .dot { background: var(--crit); }
button.chip { border: 1px solid var(--line); }
.chip .short { display: none; }
button.chip:hover { background: var(--panel-2); }
.disclaimer { align-self: flex-start; pointer-events: none; margin-top: -4px; font-size: 12px; color: #ffd0d5; background: rgba(226, 40, 59, .16); border: 1px solid rgba(226, 40, 59, .45); border-radius: 8px; padding: 4px 10px; }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; text-wrap: balance; text-shadow: 0 1px 2px #000; }
#talkBtn {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 20px 11px 14px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, .9);
  background: rgba(6, 12, 30, .9); font: 600 16px var(--display); color: #fff;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
}
#talkBtn:hover { background: #12204a; }
#talkBtn .bubble { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--red)); }
#talkBtn kbd { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, .35); color: var(--muted); }
.dock { pointer-events: auto; display: flex; gap: 6px; max-width: 100%; overflow-x: auto; padding: 6px; border-radius: 16px; scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock button { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 11px; border: 1px solid transparent; background: transparent; font-size: 14px; font-weight: 500; white-space: nowrap; }
.dock button:hover, .dock button.near { background: var(--panel-2); border-color: var(--line); }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

#joy { position: fixed; z-index: 11; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 6px); bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .28); background: rgba(8, 18, 43, .38); touch-action: none; }
#joy .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .6); }

#sheet {
  position: fixed; z-index: 20; display: flex; flex-direction: column; overflow: hidden;
  top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px)); width: min(440px, calc(100vw - 24px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
}
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--line); }
.sheet-head .swatch { width: 14px; height: 14px; border-radius: 4px; }
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head .tag { margin: 0; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--c); }
.sheet-head h2 { margin: 1px 0 0; font: 600 20px/1.25 var(--display); }
#closeSheet { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 20px; line-height: 1; flex: none; }
#closeSheet:hover { background: var(--panel-2); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.role { margin: 0; font-size: 15px; line-height: 1.6; color: #dbe4fb; }
.label { margin: 4px 0 -4px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--muted); }
.facts { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--panel-2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.fact dt { font-size: 12px; color: var(--muted); }
.fact dd { margin: 2px 0 0; font: 600 15px/1.35 var(--body); font-variant-numeric: tabular-nums; }
.fact.sev-high dd { color: var(--crit); }
.fact.sev-mid dd { color: var(--warn); }
.fact.sev-low dd { color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.act { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--c); background: transparent; font-size: 14px; font-weight: 500; text-align: left; }
.act:hover:not(:disabled) { background: var(--panel-2); }
.act:disabled, #sendBtn:disabled { opacity: .5; cursor: default; }
.log { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 11px 14px; border-radius: 14px; line-height: 1.62; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.msg.agent { background: var(--panel-2); border: 1px solid var(--line); }
.msg.me { align-self: flex-end; max-width: 86%; background: var(--me); }
.msg .who { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; font: 600 12.5px var(--display); color: var(--c); }
.msg .src { font: 500 10.5px var(--mono); letter-spacing: .08em; color: var(--muted); }
.msg h4 { margin: 10px 0 4px; font: 600 15px var(--display); }
.msg p { margin: 5px 0; }
.msg ul, .msg ol { margin: 5px 0; padding-left: 1.3em; }
.msg li { margin: 3px 0; }
.msg strong { color: #fff; }
.msg code { font: 500 13px var(--mono); background: rgba(255, 255, 255, .07); padding: 1px 5px; border-radius: 5px; }
.msg blockquote { margin: 7px 0; padding: 8px 12px; border-left: 3px solid var(--c); background: rgba(255, 255, 255, .04); border-radius: 0 8px 8px 0; }
.msg .note { color: var(--warn); font-size: 13px; }
.thinking { color: var(--muted); }
.thinking::after { content: "…"; display: inline-block; animation: blink 1.2s steps(3) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.composer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
#msg { width: 100%; box-sizing: border-box; resize: none; min-height: 46px; max-height: 140px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); font-size: 15px; line-height: 1.45; }
#msg::placeholder { color: #7f93c4; }
.composer .row { display: flex; align-items: center; gap: 8px; }
#liveNote { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.35; }
#sendBtn, #stopBtn, .primary { border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px; flex: none; }
#sendBtn, .primary { border: 0; background: var(--red); color: #fff; }
#sendBtn:hover:not(:disabled), .primary:hover { background: var(--red-hover); }
#stopBtn, .secondary { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 14px; font-weight: 500; }
.pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.pill.warn { color: #ffd0d5; background: rgba(226, 40, 59, .16); border: 1px solid rgba(226, 40, 59, .45); }
.phase { margin: 6px 0 0; font: 600 15px/1.4 var(--display); }
.phase small { display: block; font: 400 12.5px var(--body); color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tl li { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.tl .when { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font: 600 14px var(--display); color: #ff8d98; }
.tl .state { font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.tl li.next { outline: 1px solid var(--red); }
.tl li.next .state { color: #fff; }
.tl ul { margin: 0; padding-left: 1.2em; color: #dbe4fb; }
.foot { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font: 500 12px var(--body); color: var(--muted); background: var(--panel-2); }
tr:last-child td { border-bottom: 0; }
tr.next td { color: #fff; background: rgba(226, 40, 59, .12); }
td.num { font-family: var(--mono); }

#listView { position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: var(--ink);
  padding-block: calc(env(safe-area-inset-top, 0px) + 128px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cards { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.card:hover { background: var(--panel-2); }
.card .tag { font: 600 11px var(--mono); letter-spacing: .14em; color: var(--c); display: flex; gap: 8px; align-items: center; }
.card h3 { margin: 0; font: 600 18px var(--display); }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }

@media (max-width: 720px) {
  .brand h1 { font-size: 16px; }
  .brand p { display: none; }
  .chip { font-size: 12px; padding: 6px 10px; }
  .chip .long { display: none; }
  .chip .short { display: inline; }
  .disclaimer { font-size: 11px; }
  #sheet { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 78%; border-radius: 18px 18px 0 0; border-bottom: 0; }
  .sheet-head, .sheet-body, .composer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .composer { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  body.sheet-open .bottom, body.sheet-open #joy { visibility: hidden; }
  #listView { padding-top: calc(env(safe-area-inset-top, 0px) + 150px); }
}
@media (min-width: 721px) {
  body.sheet-open #hud { padding-right: calc(min(440px, 100vw - 24px) + 28px); }
}
.ticker { margin: 0; min-height: 1.35em; font-size: 13px; color: #d5def5; text-align: center; text-wrap: balance; }
#growthChip .dot { background: var(--ok); }
#growthChip.live .dot { box-shadow: 0 0 0 3px rgba(60, 207, 145, .22); }
#growthChip .beat { color: var(--muted); font-size: 12px; }
#growthChip .beat::before { content: "·"; margin: 0 6px; }
.meter { height: 8px; background: #08122b; border-radius: 99px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--red); }
.meter.thin { height: 4px; margin: 0 0 6px; }
.node-card { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
.node-card.locked { opacity: .72; }
.node-card header { display: flex; gap: 8px; align-items: flex-start; }
.node-card header > div { flex: 1; min-width: 0; }
.node-card h3 { margin: 0; font: 600 15px/1.35 var(--display); }
.node-card header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.node-card header .state, .task-row .state { margin-left: auto; font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.task-list { list-style: none; margin: 8px 0 0; padding: 0; }
.task-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.task-name { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; color: #fff; }
.task-body { padding: 2px 0 8px; }
.work-banner { display: block; width: min(1080px, 100%); margin: 0 auto 12px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: inherit; padding: 16px; cursor: pointer; }
.work-banner:hover { background: var(--panel-2); }
.work-banner .tag { font: 600 11px var(--mono); letter-spacing: .14em; color: var(--red); display: flex; gap: 8px; align-items: center; }
.work-banner h3 { margin: 4px 0; font: 600 18px var(--display); }
.work-banner p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
@media (max-width: 720px) {
  #beat { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .thinking::after { animation: none; }
}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="สำนักงานเอเจนต์ AMI แบบ 3 มิติ ใช้ปุ่มด้านล่างเพื่อไปหาเอเจนต์แต่ละตัว"></canvas>

<div id="hud">
  <div class="top">
    <div class="brand glass">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>AMI Agent Office</h1>
        <p id="brandSub">AMI Asiancodingsystems GROUP · สำนักงานโตตามแผนสู่ IPO</p>
      </div>
    </div>
    <div class="status">
      <span class="chip glass live" id="growthChip" title="สำนักงานเดินตามปฏิทินแผน"><span class="dot"></span><span id="growthText">กำลังเปิดสำนักงาน</span><span class="beat" id="beat"></span></span>
      <span class="chip glass" id="nextChip"><span class="dot"></span><span id="nextText">กำลังคำนวณ…</span></span>
      <span class="chip glass ai" id="aiChip"><span class="dot"></span><span class="long" id="aiText">กำลังเชื่อม AI…</span><span class="short" id="aiShort">กำลังเชื่อม</span></span>
      <button class="chip glass" id="workBtn" type="button"><span class="long">งานสำนักงาน</span><span class="short">งาน</span></button>
      <button class="chip glass" id="viewToggle" type="button"><span class="long">มุมมองรายการ</span><span class="short">รายการ</span></button>
    </div>
  </div>
  <div class="disclaimer">ตัวเลขทั้งหมดเป็น "เป้าหมาย" ไม่ใช่ผลจริง</div>
  <div style="flex:1"></div>
  <div class="bottom">
    <button id="talkBtn" type="button" hidden><span class="bubble" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></span><span id="talkText">คุย</span><kbd id="talkKey">E</kbd></button>
    <p class="ticker" id="ticker" aria-live="polite"></p>
    <p class="hint" id="hint"></p>
    <nav class="dock glass" id="dock" aria-label="เดินไปหาเอเจนต์"></nav>
  </div>
</div>

<div id="joy" hidden aria-hidden="true"><div class="knob"></div></div>

<section id="listView" hidden aria-label="รายการเอเจนต์">
  <button type="button" id="workBanner" class="work-banner"></button>
  <div class="cards" id="cards"></div>
</section>

<aside id="sheet" hidden aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <span class="swatch" id="sheetSwatch"></span>
    <div><p class="tag" id="sheetTag"></p><h2 id="sheetTitle"></h2></div>
    <button id="closeSheet" type="button" aria-label="ปิด">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <form class="composer" id="composer" hidden>
    <textarea id="msg" rows="2" placeholder="พิมพ์ถามเอเจนต์ หรือวางข้อมูลที่ต้องการให้ช่วย"></textarea>
    <div class="row">
      <span id="liveNote"></span>
      <button type="button" id="stopBtn" hidden>หยุด</button>
      <button type="submit" id="sendBtn">ส่ง</button>
    </div>
  </form>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- Plan data (from "แผนงาน AMI สู่ IPO", จัดทำ ต.ค. 2569) ---------- */
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const daysTo = d => Math.round((d - TODAY) / 86400000);
const fmtLong = d => new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short", year: "numeric" }).format(d);
const fmtShort = d => new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short" }).format(d);
const baht = n => "฿" + n.toLocaleString("th-TH");

const MILESTONES = [
  { d: ymd("2026-10-22"), title: "ส่งเอกสาร Shopee Mall", short: "ส่งเอกสาร Shopee Mall",
    items: ["คุณ Chutima ส่งเอกสารบริษัทสำหรับ Shopee Mall", "คุณอริย์ธัชให้สิทธิ์ Seller Center"] },
  { d: ymd("2026-10-31"), title: "ยืนยันสต็อก 30 รายการแรก", short: "ยืนยันสต็อก 30 รายการ",

function quarterTasks(today) {
  const out = [];
  let y = 2036, q = 2;
  for (let i = 0; i < 80; i++) {
    const month = q === 1 ? 1 : q === 2 ? 4 : q === 3 ? 7 : 10;
    const date = y + "-" + String(month).padStart(2, "0") + "-01";
    if (date > addIso(today, 100)) break;
    const label = "Q" + q + " " + (y + 543);
    out.push({
      id: "keep-" + date, date, title: "เช็กลิสต์รักษาจังหวะ " + label,
      body: `**เช็กลิสต์ไตรมาส ${label}** ตัวเลขให้ทีมกรอกจากบัญชี
- ยอดขายออนไลน์ ACS ไตรมาสนี้: [กรอก]
- กำไรสุทธิกลุ่ม: [กรอก]

ขั้นต่อไป: เก็บรายงานไตรมาสนี้ไว้คู่กับเช็กลิสต์ ห้ามใส่เป้าหมายแทนผลจริง`,
    });
    q += 1;
    if (q > 4) { q = 1; y += 1; }
  }
  return out;
}
function addIso(iso, days) {
  const d = ymd(iso);
  d.setDate(d.getDate() + days);
  return isoDay(d);
}
function nodeTasks(node, today) {
  const list = node.id === "maintain" ? quarterTasks(today) : node.tasks;
  return list.map(t => ({ ...t, nodeId: node.id, agent: node.agent, node: node.name, unlock: node.unlock }));
}
function allTasks(today) {

  for (const n of NODES) out.push(...nodeTasks(n, today));

}
function taskById(id, today) {

    p.acked = p.acked || {};

function addPulse(task, today) {
  const day = task.date < today ? task.date : today;
  let row = office.pulses.find(p => p.date === day);
  if (!row) { row = { date: day, titles: [] }; office.pulses.push(row); }
  if (!row.titles.includes(task.title)) row.titles.push(task.title);
  office.pulses.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (office.pulses.length > 14) {
    const drop = office.pulses.length - 14;
    office.pulses = office.pulses.slice(drop);
    office.pulseDropped += drop;
  }
}
function reconcile() {
  const today = dayNow();
  const tasks = allTasks(today);
  let changed = false;
  for (const t of tasks) {
    if (t.date < today && t.unlock <= t.date && !office.done[t.id]) {
      office.done[t.id] = t.date + "T17:00:00";
      addPulse(t, today);
      changed = true;
    }
  }
  if (office.doing) {
    const live = taskById(office.doing.id, today);
    if (!live || office.done[live.id] || live.date > today) { office.doing = null; changed = true; }
    else if (Date.now() - office.doing.since >= workMs) {
      office.done[live.id] = new Date().toISOString();
      addPulse(live, today);
      office.doing = null;
      changed = true;
    }
  }
  if (!office.doing) {
    const next = tasks
      .filter(t => t.date === today && t.unlock <= today && !office.done[t.id])
      .sort((a, b) => a.id < b.id ? -1 : 1)[0];
    if (next) { office.doing = { id: next.id, since: Date.now() }; changed = true; }
  }
  if (changed) saveOffice();
  return changed;
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (h, h2, t) => { const a = hexRgb(h), b = hexRgb(h2); return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COARSE = matchMedia("(pointer: coarse)").matches;

function inline(s) {
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(src) {
  const lines = esc(src).split("\n");
  let html = "", list = null;
  const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    close();
    if (!line.trim()) continue;
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) { html += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { html += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    if (/^-{3,}$/.test(line.trim())) continue;
    html += "<p>" + inline(line) + "</p>";
  }
  close();
  return html;
}

};
const DENY = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

async function askLive(id, content, display) {
  if (!sample || busy) return;
  const a = T[id];
  const hist = turns[id] || (turns[id] = []);
  hist.push({ role: "user", content });
  addMsg(id, "me", esc(display));
  const out = addMsg(id, "agent", '<span class="thinking">กำลังคิด</span>', "AI สด");
  setBusy(true);
  ctl = new AbortController();
  let recent = hist.slice(-10);
  while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
  try {
    const res = await sample([{ role: "user", content: rulesFor(a) }, ...recent], {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { out.innerHTML = md(text); scrollLog(); },
    });
    hist.push({ role: "assistant", content: res.text });
    out.innerHTML = md(res.text) + (res.truncated ? '<p class="note">คำตอบถูกตัดกลางทาง ลองถามทีละเรื่อง</p>' : "");
  } catch (e) {
    hist.pop();
    const code = e && e.code;
    if (code === "cancelled") { out.innerHTML = (e.text ? md(e.text) : "") + '<p class="note">หยุดแล้ว</p>'; }
    else if (DENY.includes(code)) {
      sample = null; setAI(code === "not_granted" ? "denied" : "offline");
      out.innerHTML = md("ยังใช้ Claude ในหน้านี้ไม่ได้ ใช้ปุ่มงานด่วนเพื่อดูแผนงานสำเร็จรูปแทน");
    } else {
      out.innerHTML = (e && e.text && code !== "refused" ? md(e.text) : "") + '<p class="note">' + esc(ERR[code] || ERR.upstream_error) + "</p>";
    }
  } finally {
    setBusy(false); scrollLog();
  }
}

  const keep = new Set(items.map(i => i.id));

  }
  for (const item of items) {
    let mesh = lampMeshes.get(item.id);
    if (!mesh) {
      const matL = new THREE.MeshStandardMaterial({ color: item.color, emissive: item.color, emissiveIntensity: 0.35, roughness: 0.45, metalness: 0.08 });

    mesh.material.emissiveIntensity = item.hot ? 0.95 : 0.28;
    mesh.scale.setScalar(item.hot ? 1.18 : 1);
  }
};
if (window.__officeRender) window.__officeRender();

/* player */
const player = figure(0x2f6be3, false);
player.scale.setScalar(1.08);
{
  const { cv, tex } = makeTex(256, 128); const c = cv.getContext("2d");
  c.fillStyle = "#fff"; c.font = "700 84px " + F_DISP; c.textAlign = "center"; c.fillText("AMI", 128, 96);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.28), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  plate.position.set(0, 0.68, 0.43); player.add(plate);
  boards.push({ draw: () => { c.clearRect(0, 0, 256, 128); c.fillStyle = "#fff"; c.font = "700 84px " + F_DISP; c.textAlign = "center"; c.fillText("AMI", 128, 96); tex.needsUpdate = true; } });
}
const ptag = makeTag("อริย์ธัช · CEO", "#2f6be3", 2.7); ptag.position.set(0, 2.25, 0); player.add(ptag);
const P = { x: 0, z: 12.6, rot: 0 };
player.position.set(P.x, 0, P.z);

/* staff walking the aisles */
const LX = [-18, -6, 6, 18], LZ = [-10.5, 0.5, 11];
const node = (i, j) => ({ i, j, x: LX[i], z: LZ[j] });
const npcs = [];
if (!RM) for (const [i, j, col] of [[0, 1, 0x1b2440], [3, 0, 0x22283a], [1, 2, 0x1d2a4a], [2, 1, 0x262033]]) {
  const f = figure(col, false); const n = node(i, j); f.position.set(n.x, 0, n.z);
  npcs.push({ f, at: n, to: null, wait: Math.random() * 2, prev: null });
}
function nextNode(n, prev) {
  const opts = [];
  if (n.i > 0) opts.push(node(n.i - 1, n.j)); if (n.i < LX.length - 1) opts.push(node(n.i + 1, n.j));
  if (n.j > 0) opts.push(node(n.i, n.j - 1)); if (n.j < LZ.length - 1) opts.push(node(n.i, n.j + 1));
  const f = opts.filter(o => !prev || o.i !== prev.i || o.j !== prev.j);
  const pool = f.length ? f : opts; return pool[Math.floor(Math.random() * pool.length)];
}

/* path finding on a coarse grid */
const R = 0.48, CELL = 0.5;
const NX = Math.ceil((B.x1 - B.x0) / CELL), NZ = Math.ceil((B.z1 - B.z0) / CELL);
function blocked(x, z) {

  for (const b of BOXES) if (x > b.x0 - R && x < b.x1 + R && z > b.z0 - R && z < b.z1 + R) return true;

}
const GRID = new Uint8Array(NX * NZ);
const cx = i => B.x0 + (i + 0.5) * CELL, cz = j => B.z0 + (j + 0.5) * CELL;
for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) GRID[j * NX + i] = blocked(cx(i), cz(j)) ? 1 : 0;
const toCell = (x, z) => [clamp(Math.floor((x - B.x0) / CELL), 0, NX - 1), clamp(Math.floor((z - B.z0) / CELL), 0, NZ - 1)];
function nearestFree(i, j) {

  for (let k = 1; k <= n; k++) { const t = k / n; if (blocked(ax + (bx - ax) * t, az + (bz - az) * t)) return false; }
  return true;
}
function findPath(fx, fz, tx, tz) {
  if (los(fx, fz, tx, tz)) return [{ x: tx, z: tz }];
  const [si, sj] = nearestFree(...toCell(fx, fz)), [ei, ej] = nearestFree(...toCell(tx, tz));
  const N = NX * NZ, g = new Float32Array(N).fill(Infinity), from = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const heap = [], push = (k, f) => { heap.push([f, k]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };

  const h = (i, j) => { const dx = Math.abs(i - ei), dz = Math.abs(j - ej); return Math.max(dx, dz) + 0.414 * Math.min(dx, dz); };
  const s = sj * NX + si, e = ej * NX + ei; g[s] = 0; push(s, h(si, sj));
  while (heap.length) {
    const [, k] = pop(); if (closed[k]) continue; closed[k] = 1; if (k === e) break;
    const i = k % NX, j = (k / NX) | 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {

      if (di && dj && (GRID[j * NX + a] || GRID[b * NX + i])) continue;

  while (idx < cells.length) {
    let far = idx; for (let k = cells.length - 1; k > idx; k--) if (los(ax, az, cells[k].x, cells[k].z)) { far = k; break; }
    out.push(cells[far]); ax = cells[far].x; az = cells[far].z; idx = far + 1;
  }

}

/* movement + input */
const keys = new Set();
let auto = null, joyV = { x: 0, z: 0 }, moved = false, zoom = 1;
function walkTo(x, z, open) { auto = { path: findPath(P.x, P.z, x, z), open }; }
goTo = (id, open) => {
  const t = T[id]; if (!t) return;
  if (listMode) { openSheet(id); return; }
  if (Math.hypot(P.x - t.spot.x, P.z - t.spot.z) < 0.6) { if (open) openSheet(id); return; }
  walkTo(t.spot.x, t.spot.z, open ? id : null);
};
const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
document.addEventListener("keydown", e => {
  if (typing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) { keys.add(k); auto = null; if (k.startsWith("arrow")) e.preventDefault(); }
  if ((k === "e" || (k === "enter" && e.target === canvas)) && near) { e.preventDefault(); openSheet(near); }
});
document.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => keys.clear());

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pointers = new Map(); let down = null, pinch0 = 0, zoom0 = 1;
canvas.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; down = null; }
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinch0) { const [a, b] = [...pointers.values()]; zoom = clamp(zoom0 * pinch0 / Math.max(40, Math.hypot(a.x - b.x, a.y - b.y)), 0.6, 1.7); }
});
const endPointer = e => {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0;
  if (!down || e.type === "pointercancel") { down = null; return; }
  const d = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (d > 10 || dt > 700) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit && hit.object.userData.target) { goTo(hit.object.userData.target, true); return; }
  const pt = new THREE.Vector3(); if (ray.ray.intersectPlane(plane0, pt)) { const [i, j] = nearestFree(...toCell(pt.x, pt.z)); walkTo(cx(i), cz(j), null); }
};
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom = clamp(zoom * (1 + e.deltaY * 0.0012), 0.6, 1.7); }, { passive: false });

if (COARSE) {
  const joy = $("joy"), knob = joy.querySelector(".knob"); joy.hidden = false;
  let jid = null;
  const setJ = e => { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = Math.hypot(dx, dy), lim = 40; if (m > lim) { dx *= lim / m; dy *= lim / m; } knob.style.transform = "translate(" + dx + "px," + dy + "px)"; joyV = { x: dx / lim, z: dy / lim }; if (m > 6) auto = null; };
  joy.addEventListener("pointerdown", e => { jid = e.pointerId; joy.setPointerCapture(jid); setJ(e); });
  joy.addEventListener("pointermove", e => { if (e.pointerId === jid) setJ(e); });
  const rel = e => { if (e.pointerId !== jid) return; jid = null; joyV = { x: 0, z: 0 }; knob.style.transform = ""; };
  joy.addEventListener("pointerup", rel); joy.addEventListener("pointercancel", rel);
}

function collide(p) {
  for (let pass = 0; pass < 2; pass++) for (const b of BOXES) {
    const qx = clamp(p.x, b.x0, b.x1), qz = clamp(p.z, b.z0, b.z1), dx = p.x - qx, dz = p.z - qz, d2 = dx * dx + dz * dz;
    if (d2 >= R * R) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = qx + dx / d * R; p.z = qz + dz / d * R; }
    else { const o = [[p.x - b.x0 + R, -1, 0], [b.x1 - p.x + R, 1, 0], [p.z - b.z0 + R, 0, -1], [b.z1 - p.z + R, 0, 1]].sort((a, c) => a[0] - c[0])[0]; p.x += o[1] * o[0]; p.z += o[2] * o[0]; }
  }
  p.x = clamp(p.x, B.x0, B.x1); p.z = clamp(p.z, B.z0, B.z1);
}

/* camera + layout */
let viewW = 1, viewH = 1;
function layout() {
  viewW = window.innerWidth; viewH = window.innerHeight;
  renderer.setSize(viewW, viewH, false);
  camera.aspect = viewW / viewH;
  const sh = $("sheet");
  if (!sh.hidden) {
    const r = sh.getBoundingClientRect();
    if (viewW > 720) camera.setViewOffset(viewW, viewH, r.width / 2, 0, viewW, viewH);
    else camera.setViewOffset(viewW, viewH, 0, r.height / 2, viewW, viewH);
  } else camera.clearViewOffset();
  camera.fov = camera.aspect < 0.8 ? 50 : 42;
  camera.updateProjectionMatrix();
}
window.__layout = () => requestAnimationFrame(layout);
window.addEventListener("resize", layout);
layout();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function camGoal() {
  const k = zoom * (camera.aspect < 0.8 ? 1.5 : camera.aspect < 1.2 ? 1.25 : 1.12);
  return [new THREE.Vector3(P.x * 0.86, 15 * k, P.z + 11.5 * k), new THREE.Vector3(P.x * 0.92, 0.5, P.z - 4)];
}
{ const [p, l] = camGoal(); camPos.copy(p); camLook.copy(l); camera.position.copy(p); camera.lookAt(l); }

/* proximity */
let near = null;
function updateNear() {
  let best = null, bd = 2.5;
  for (const t of ALL) { const d = Math.hypot(P.x - t.spot.x, P.z - t.spot.z); if (d < bd) { bd = d; best = t.id; } }
  if (best === near) return;
  near = best;
  const btn = $("talkBtn");
  syncTalk();
  dock.querySelectorAll("button").forEach(b => b.classList.toggle("near", b.dataset.id === near));
  if (near) { const t = T[near]; btn.style.setProperty("--c", t.color); $("talkText").textContent = t.talk; $("talkKey").hidden = COARSE; }
}
$("talkBtn").onclick = () => { if (near) openSheet(near); };
window.__syncTalk = syncTalk;
function syncTalk() { $("talkBtn").hidden = !near || near === current; }

/* fonts: draw once with fallbacks, again when the web fonts arrive */
const redrawAll = () => { boards.forEach(b => b.draw()); tags.forEach(t => t.draw()); };
window.__redrawBoards = redrawAll;
if (document.fonts && document.fonts.load) {
  const specs = ["600 40px Prompt", "700 40px Prompt", "italic 400 40px Prompt", "500 30px \"IBM Plex Sans Thai\"", "600 30px \"IBM Plex Sans Thai\"", "600 40px \"IBM Plex Mono\""];
  Promise.race([Promise.all(specs.map(f => document.fonts.load(f, "กขค ABC 123 ฿").catch(() => null))), new Promise(r => setTimeout(r, 4000))]).then(redrawAll);
}

/* loop */
let last = performance.now();
const SPEED = 6;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  let vx = 0, vz = 0;
  if (keys.has("a") || keys.has("arrowleft")) vx -= 1; if (keys.has("d") || keys.has("arrowright")) vx += 1;
  if (keys.has("w") || keys.has("arrowup")) vz -= 1; if (keys.has("s") || keys.has("arrowdown")) vz += 1;
  vx += joyV.x; vz += joyV.z;
  let m = Math.hypot(vx, vz);
  if (m > 0.08) { if (m > 1) { vx /= m; vz /= m; m = 1; } vx *= SPEED; vz *= SPEED; }
  else if (auto && auto.path.length) {
    const w = auto.path[0], dx = w.x - P.x, dz = w.z - P.z, d = Math.hypot(dx, dz);
    if (d < 0.18) { auto.path.shift(); if (!auto.path.length) { const open = auto.open; auto = null; if (open) { const tt = T[open]; P.rot = Math.atan2(-(tt.x !== undefined ? tt.x - P.x : 0), -((tt.z !== undefined ? tt.z : tt.spot.z - 3) - P.z)); openSheet(open); } } vx = vz = 0; }
    else { const s = Math.min(SPEED, d / dt); vx = dx / d * s; vz = dz / d * s; }
  } else { vx = vz = 0; }
  const sp = Math.hypot(vx, vz);
  if (sp > 0.01) {
    const p = { x: P.x + vx * dt, z: P.z + vz * dt }; collide(p); P.x = p.x; P.z = p.z;
    const target = Math.atan2(-vx, -vz); let dr = target - P.rot; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); P.rot += dr * Math.min(1, dt * 12);
    if (!moved) { moved = true; $("hint").hidden = true; }
  }
  player.position.set(P.x, 0, P.z); player.rotation.y = P.rot;
  const pb = player.userData; pb.body.position.y = pb.baseY + (sp > 0.5 && !RM ? Math.abs(Math.sin(t * 11)) * 0.06 : 0); pb.head.position.y = pb.body.position.y + 0.78;
  if (!RM) for (const a of agentFigs) { const u = a.f.userData; u.head.position.y = u.headY + Math.sin(t * 2 + a.phase) * 0.025; u.body.rotation.z = Math.sin(t * 3.1 + a.phase) * 0.025; }
  for (const n of npcs) {
    if (n.wait > 0) { n.wait -= dt; continue; }
    if (!n.to) n.to = nextNode(n.at, n.prev);
    const dx = n.to.x - n.f.position.x, dz = n.to.z - n.f.position.z, d = Math.hypot(dx, dz);
    if (d < 0.05) { n.prev = n.at; n.at = n.to; n.to = null; n.wait = Math.random() < 0.4 ? 1 + Math.random() * 2.5 : 0; continue; }
    const s = Math.min(1.5 * dt, d); n.f.position.x += dx / d * s; n.f.position.z += dz / d * s; n.f.rotation.y = Math.atan2(-dx, -dz);
    n.f.userData.body.position.y = n.f.userData.baseY + Math.abs(Math.sin(t * 8)) * 0.04; n.f.userData.head.position.y = n.f.userData.body.position.y + 0.78;
  }
  const [gp, gl] = camGoal(); const k = 1 - Math.exp(-dt * 5);
  camPos.lerp(gp, k); camLook.lerp(gl, k); camera.position.copy(camPos); camera.lookAt(camLook);
  updateNear();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
